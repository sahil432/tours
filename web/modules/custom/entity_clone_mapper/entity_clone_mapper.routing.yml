entity_clone_mapper.settings:
  path: '/admin/config/content/entity-clone-mapper'
  defaults:
    _form: '\Drupal\entity_clone_mapper\Form\EntityCloneMapperConfigForm'
    _title: 'Entity Clone Mapper Configuration'
  requirements:
    _permission: 'administer entity clone mapper'

entity_clone_mapper.clone_entity:
  path: '/entity-clone-mapper/clone/{entity_type}/{entity}'
  defaults:
    _controller: '\Drupal\entity_clone_mapper\Controller\EntityCloneController::cloneEntity'
    _title: 'Clone Entity'
  requirements:
    _permission: 'clone entities'
    _entity_access: 'entity.update'
  options:
    parameters:
      entity:
        type: entity:{entity_type}
