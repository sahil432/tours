entity_clone_mapper.settings:
  type: config_object
  label: 'Entity Clone Mapper settings'
  mapping:
    mappings:
      type: sequence
      label: 'Clone mappings'
      sequence:
        type: mapping
        label: 'Clone mapping'
        mapping:
          enabled:
            type: boolean
            label: 'Enabled'
          source_entity_type:
            type: string
            label: 'Source entity type'
          source_bundle:
            type: string
            label: 'Source bundle'
          target_entity_type:
            type: string
            label: 'Target entity type'
          target_bundle:
            type: string
            label: 'Target bundle'
          clone_all_translations:
            type: boolean
            label: 'Clone all translations'
          field_mappings:
            type: sequence
            label: 'Field mappings'
            sequence:
              type: string
              label: 'Target field name'
